<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --rule: #e0e0e0; }
        
        body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        .site-footer {
            padding: 6vh 6vw;
            border-top: 1px solid var(--rule);
            background-color: #fff;
            margin-top: auto;
        }

        .footer-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 2rem;
        }

        .footer-logo { height: 30px; display: block; }

        .footer-nav { display: flex; gap: 3rem; }
        .footer-nav a { 
            text-decoration: none; color: #000; font-size: 0.7rem; 
            letter-spacing: 0.2em; text-transform: uppercase; 
        }

        .footer-right { text-align: right; font-size: 0.7rem; color: #888; }

        @media (max-width: 768px) {
            .footer-container { grid-template-columns: 1fr; text-align: center; gap: 2rem; }
            .footer-nav { flex-direction: column; gap: 1rem; }
            .footer-right { text-align: center; }
        }
    </style>
</head>
<body>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-left">
                <img src="logo.png" alt="Logo Alexane" class="footer-logo">
            </div>
            <nav class="footer-nav">
                <a href="https://instagram.com" target="_blank">Instagram</a>
                <a href="https://linkedin.com" target="_blank">LinkedIn</a>
                <a href="cv.pdf" download>CV / Portfolio</a>
            </nav>
            <div class="footer-right">
                <p>&copy; 2026 Alexane</p>
            </div>
        </div>
    </footer>

</body>
</html>
