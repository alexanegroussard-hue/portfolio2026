    <span class="brand-text">

    </span>
  </a>

  <div class="nav-right-group">
    <div class="lang-switch notranslate" translate="no" aria-label="Langue">

      <button type="button" data-lang="en" lang="en" title="English" style="--flag: url('https://cdn.gtranslate.net/flags/svg/en.svg')" aria-label="English"></button>
      <button type="button" data-lang="nl" lang="nl" title="Nederlands" style="--flag: url('https://cdn.gtranslate.net/flags/svg/nl.svg')" aria-label="Nederlands"></button>

    <div class="nav-links">

<!-- ✅ Un seul mobile-menu, sans le duplicate -->
<div class="mobile-menu" id="mobile-menu">
  <a href="profil.html">Profil</a>
  <a href="contact.html">Contact</a>
  <div class="lang-switch notranslate" translate="no" aria-label="Langue">
    <button type="button" data-lang="fr" lang="fr" title="Français" style="--flag: url('https://cdn.gtranslate.net/flags/svg/fr.svg')" aria-label="Français"></button>
    <button type="button" data-lang="en" lang="en" title="English" style="--flag: url('https://cdn.gtranslate.net/flags/svg/en.svg')" aria-label="English"></button>
    <button type="button" data-lang="nl" lang="nl" title="Nederlands" style="--flag: url('https://cdn.gtranslate.net/flags/svg/nl.svg')" aria-label="Nederlands"></button>
  </div>
</div>

<!-- Widget GTranslate masqué : il fait la traduction, le sélecteur .lang-switch le pilote -->
<div class="gtranslate_wrapper"></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const burger = document.getElementById('burger');
    const mobileMenu = document.getElementById('mobile-menu');

    if (burger && mobileMenu) {
      // ✅ Gère à la fois les clics souris et les taps tactiles
      ['click', 'touchstart'].forEach(eventType => {
        burger.addEventListener(eventType, (e) => {
          e.preventDefault(); // Évite le double-déclenchement click + touchstart
          burger.classList.toggle('open');
          mobileMenu.classList.toggle('open');
          document.body.style.overflow = burger.classList.contains('open') ? 'hidden' : 'auto';
        });
      });
    }
  });
</script>
